[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kylin-webapp"
version = "0.1.0"
description = "Configurable desktop client for a central Kylin service"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
kylin-webapp = "kylin_webapp.client:main"

[tool.setuptools.packages.find]
where = ["src"]
