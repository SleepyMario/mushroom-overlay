[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kylin-client"
version = "0.1.0"
description = "Configurable desktop client for a central Kylin service"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
kylin-client = "kylin_client.client:main"
kylin-client-tunnel = "kylin_client.tunnel:main"

[tool.setuptools.packages.find]
where = ["src"]
